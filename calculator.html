<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Заголовок вкладки браузера -->
  <title>კალკულატორი</title>

  <!-- Грузинский шрифт из Google Fonts (тот же, что в about.html) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    /* ===== Цвета: те же, что в about.html ===== */
    :root {
      --gradient-start: #7b5cff;  /* фиолетовый */
      --gradient-end:   #2ea8ff;  /* синий */
      --card-bg:        #ffffff;  /* фон карточки */
      --text:           #24213a;  /* основной текст */
      --text-soft:      #6b6880;  /* бледный текст */
      --key-bg:         #f3f1ff;  /* фон кнопок с цифрами */
      --clear-bg:       #ffe3e8;  /* фон кнопки C */
      --clear-text:     #e0405e;  /* цвет текста кнопки C */
      --line:           #e6e3f5;  /* тонкие линии в истории */
    }

    /* ===== Ночной режим: те же переменные, но тёмные цвета ===== */
    body.dark {
      --gradient-start: #3a2a8a;
      --gradient-end:   #0f4a7a;
      --card-bg:        #1e1b2e;
      --text:           #ecebf5;
      --text-soft:      #a9a6bd;
      --key-bg:         #2c2843;
      --clear-bg:       #4a2330;
      --clear-text:     #ff7a92;
      --line:           #34304d;
    }

    /* ===== Вся страница ===== */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans Georgian", sans-serif;
      color: var(--text);
      /* Фон с плавным переходом цветов */
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    /* ===== Белая карточка в центре ===== */
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(20, 10, 60, 0.25);
      position: relative;   /* чтобы кнопку режима можно было поставить в угол */
      transition: background 0.3s, color 0.3s;
    }

    /* ===== Кнопка дня/ночи в правом верхнем углу карточки ===== */
    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--key-bg);
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .theme-toggle:hover {
      transform: rotate(20deg) scale(1.1);
    }

    /* Кнопка истории — такая же круглая, но в левом углу */
    .history-toggle {
      right: auto;
      left: 16px;
    }

    /* Когда история спрятана, значок становится бледным */
    .layout.no-history .history-toggle {
      opacity: 0.5;
    }

    /* Спрятанная история: карточка исчезает, остаётся только калькулятор */
    .layout.no-history .history {
      display: none;
    }

    .layout.no-history {
      max-width: 360px;
    }

    /* ===== Две карточки в ряд: калькулятор слева, история справа ===== */
    .layout {
      display: flex;
      gap: 20px;
      align-items: stretch;   /* обе карточки одной высоты */
      width: 100%;
      max-width: 640px;
    }

    /* Калькулятор сохраняет свою прежнюю ширину */
    .layout > main.card {
      flex: 0 0 360px;
    }

    /* ===== История вычислений (отдельная карточка) ===== */
    .history {
      flex: 0 0 260px;
      display: flex;
      flex-direction: column;
    }

    /* Место для списка: занимает всю оставшуюся высоту карточки */
    .history-box {
      position: relative;
      flex: 1;
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .history h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Маленькая кнопка «очистить историю» */
    .history-clear {
      font-family: inherit;
      font-size: 0.85rem;
      border: none;
      background: none;
      color: var(--text-soft);
      cursor: pointer;
      text-decoration: underline;
    }

    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      /* Список «прилипает» к краям своего места и не растягивает карточку.
         Если строк много — появится прокрутка */
      position: absolute;
      inset: 0;
      overflow-y: auto;
    }

    .history-list li {
      padding: 6px 4px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      color: var(--text-soft);
    }

    /* Ответ в строке истории — жирным */
    .history-list li b {
      color: var(--text);
    }

    /* Надпись, когда история пустая */
    .history-empty {
      text-align: center;
      font-style: italic;
    }

    h1 {
      margin: 0 0 20px;
      padding: 0 40px;   /* место для кнопки дня/ночи, чтобы текст на неё не налезал */
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
    }

    /* ===== Экран калькулятора ===== */
    .display {
      background: var(--key-bg);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 20px;
      text-align: right;
      /* Длинные числа не вылезают за край */
      overflow: hidden;
    }

    /* Маленькая строка сверху: например «12 +» */
    .expression {
      min-height: 1.4em;
      color: var(--text-soft);
      font-size: 1rem;
    }

    /* Большое число: то, что вводим, или результат */
    .result {
      font-size: 2.4rem;
      font-weight: 800;
      word-break: break-all;
    }

    /* ===== Сетка кнопок 4×4 ===== */
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .keys button {
      font-family: inherit;
      font-size: 1.4rem;
      font-weight: 600;
      height: 64px;
      border: none;
      border-radius: 16px;
      background: var(--key-bg);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    /* При наведении кнопка немного приподнимается (как карточки хобби) */
    .keys button:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(123, 92, 255, 0.2);
    }

    /* При нажатии кнопка «вдавливается» */
    .keys button:active {
      transform: translateY(0);
    }

    /* Кнопки операций и «=» — с градиентом */
    .keys .op {
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: white;
    }

    /* Кнопка очистки C */
    .keys .clear {
      background: var(--clear-bg);
      color: var(--clear-text);
    }

    /* Кнопка исправления ⌫ — стирает последнюю цифру */
    .keys .back {
      color: var(--gradient-start);
    }

    /* Широкая кнопка — занимает две колонки */
    .keys .wide {
      grid-column: span 2;
    }

    /* ===== Ссылка «← на главную» над карточкой ===== */
    .home-link {
      margin-bottom: 16px;
      padding: 8px 18px;
      border-radius: 999px;            /* полностью круглые края */
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }

    .home-link:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* ===== Нижняя строка ===== */
    footer {
      margin-top: 24px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.9rem;
    }

    /* ===== Узкий экран (телефон): история — выезжающая панель справа ===== */
    @media (max-width: 700px) {
      .layout {
        position: relative;   /* панель встаёт поверх калькулятора */
        max-width: 360px;
      }

      /* Калькулятор занимает всю ширину, как раньше */
      .layout > main.card {
        flex: 1 1 auto;
      }

      /* Панель истории прижата к правому краю калькулятора, по всей его высоте */
      .history {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 65%;
        z-index: 5;
        box-shadow: -10px 0 30px rgba(20, 10, 60, 0.3);
        transition: opacity 0.3s, transform 0.3s;
      }

      /* Закрытая панель: прозрачная, чуть сдвинута вправо и не мешает нажимать кнопки */
      .layout.no-history .history {
        display: flex;
        opacity: 0;
        transform: translateX(8px);
        pointer-events: none;
      }
    }

    /* ===== Маленький экран (телефон) ===== */
    @media (max-width: 480px) {
      .card { padding: 24px 16px; }
      .keys button { height: 56px; }
    }
  </style>
</head>
<body>

  <!-- Ссылка обратно на главную страницу -->
  <a class="home-link" href="index.html">← მთავარი</a>

  <div class="layout">
  <main class="card">
    <!-- Кнопка «спрятать / показать историю» (левый угол) -->
    <button class="theme-toggle history-toggle" id="history-toggle" title="ისტორიის დამალვა">🕘</button>

    <!-- Кнопка дня/ночи (правый угол) -->
    <button class="theme-toggle" id="theme" title="ღამის / დღის რეჟიმი">🌙</button>

    <h1>აჩის კალკულატორი</h1>

    <!-- Экран -->
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <!-- Кнопки. data-digit — цифра, data-op — операция -->
    <div class="keys">
      <!-- Верхний ряд: очистить всё и стереть одну цифру -->
      <button class="clear wide" id="clear">C</button>
      <button class="back wide" id="back" title="წაშლა">⌫</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-op="/">÷</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-op="*">×</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-op="-">−</button>

      <button class="wide" data-digit="0">0</button>
      <button class="op" id="equals">=</button>
      <button class="op" data-op="+">+</button>
    </div>
  </main>

  <!-- История прошлых вычислений — отдельная карточка справа -->
  <section class="card history">
    <div class="history-head">
      <h2>ისტორია</h2>
      <button class="history-clear" id="history-clear">გასუფთავება</button>
    </div>
    <div class="history-box">
      <ul class="history-list" id="history-list"></ul>
    </div>
  </section>
  </div>

  <footer>© 2026 გიორგი ჭეიშვილი</footer>

  <script>
    // ===== Находим элементы экрана =====
    const expressionEl = document.getElementById("expression");
    const resultEl = document.getElementById("result");

    // ===== Состояние калькулятора =====
    let current = "0";        // число, которое сейчас набираем (строкой)
    let previous = null;      // первое число (до операции)
    let operator = null;      // выбранная операция: + - * /
    let startNew = false;     // true = следующая цифра начинает новое число

    // Красивые значки операций для экрана
    const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

    // Обновить то, что видно на экране
    function updateScreen() {
      resultEl.textContent = current;
      expressionEl.textContent = operator ? previous + " " + symbols[operator] : "";
    }

    // Посчитать a (операция) b
    function calculate(a, b, op) {
      switch (op) {
        case "+": return a + b;
        case "-": return a - b;
        case "*": return a * b;
        case "/": return b === 0 ? null : a / b; // на ноль делить нельзя
      }
    }

    // Округляем, чтобы не было 0.30000000000000004
    function tidy(number) {
      return String(parseFloat(number.toFixed(10)));
    }

    // Нажали цифру
    function pressDigit(digit) {
      if (current === "შეცდომა") clearAll();
      if (startNew || current === "0") {
        current = digit;      // начинаем новое число
        startNew = false;
      } else if (current.length < 15) {
        current += digit;     // дописываем цифру в конец
      }
      updateScreen();
    }

    // Нажали операцию (+ − × ÷)
    function pressOperator(op) {
      if (current === "შეცდომა") return;
      // Если операция уже была и ввели второе число — сначала считаем
      if (operator && !startNew) {
        if (!finish()) return;
      }
      previous = current;
      operator = op;
      startNew = true;
      updateScreen();
    }

    // Посчитать результат. Возвращает false, если была ошибка
    function finish() {
      if (!operator) return true;
      const answer = calculate(parseFloat(previous), parseFloat(current), operator);
      // Запоминаем пример, пока числа ещё не стёрты, например «12 + 7»
      const example = previous + " " + symbols[operator] + " " + current;
      operator = null;
      previous = null;
      startNew = true;
      if (answer === null) {
        current = "შეცდომა"; // «ошибка» — деление на ноль
        addToHistory(example, current);
        updateScreen();
        return false;
      }
      current = tidy(answer);
      addToHistory(example, current);
      updateScreen();
      return true;
    }

    // Нажали C — всё сбрасываем
    function clearAll() {
      current = "0";
      previous = null;
      operator = null;
      startNew = false;
      updateScreen();
    }

    // Нажали ⌫ — стираем последнюю цифру набираемого числа
    function pressBack() {
      if (current === "შეცდომა") { clearAll(); return; }
      // Готовый результат или только что нажатую операцию не стираем
      if (startNew) return;
      current = current.slice(0, -1);   // убираем последний символ
      if (current === "" || current === "-") current = "0";
      updateScreen();
    }

    // ===== История =====
    const historyListEl = document.getElementById("history-list");
    let history = [];   // список строк вида «12 + 7 = 19»

    // Добавить вычисление в историю (новые — сверху, храним не больше 10)
    function addToHistory(example, answer) {
      history.unshift({ example: example, answer: answer });
      if (history.length > 10) history.pop();
      renderHistory();
    }

    // Нарисовать историю на странице
    function renderHistory() {
      historyListEl.innerHTML = "";
      if (history.length === 0) {
        historyListEl.innerHTML = '<li class="history-empty">ჯერ ცარიელია</li>';
        return;
      }
      history.forEach(function (item) {
        const li = document.createElement("li");
        li.textContent = item.example + " = ";
        const b = document.createElement("b");
        b.textContent = item.answer;
        li.appendChild(b);
        historyListEl.appendChild(li);
      });
    }

    // Очистить историю
    document.getElementById("history-clear").addEventListener("click", function () {
      history = [];
      renderHistory();
    });

    renderHistory();   // сразу показываем «пусто»

    // ===== Спрятать / показать историю =====
    const layoutEl = document.querySelector(".layout");
    const historyToggleBtn = document.getElementById("history-toggle");

    // Узкий ли сейчас экран (телефон)? Ширина та же, что в CSS: 700px
    const phoneScreen = window.matchMedia("(max-width: 700px)");

    function setHistoryVisible(isVisible) {
      layoutEl.classList.toggle("no-history", !isVisible);
      // Подсказка при наведении: что сделает кнопка
      historyToggleBtn.title = isVisible ? "ისტორიის დამალვა" : "ისტორიის ჩვენება";
      // На компьютере запоминаем выбор (на телефоне панель всегда начинает закрытой)
      if (!phoneScreen.matches) {
        try { localStorage.setItem("calc-history", isVisible ? "show" : "hide"); } catch (e) {}
      }
    }

    historyToggleBtn.addEventListener("click", function () {
      setHistoryVisible(layoutEl.classList.contains("no-history"));
    });

    // При открытии страницы:
    // на телефоне панель закрыта, чтобы не закрывать кнопки калькулятора;
    // на компьютере вспоминаем прошлый выбор
    if (phoneScreen.matches) {
      setHistoryVisible(false);
    } else {
      let saved = null;
      try { saved = localStorage.getItem("calc-history"); } catch (e) {}
      setHistoryVisible(saved !== "hide");
    }

    // ===== Ночной / дневной режим =====
    const themeBtn = document.getElementById("theme");

    function setTheme(isDark) {
      document.body.classList.toggle("dark", isDark);
      themeBtn.textContent = isDark ? "☀️" : "🌙";   // показываем, куда переключимся
      // Запоминаем выбор в браузере (если браузер разрешает)
      try { localStorage.setItem("calc-theme", isDark ? "dark" : "light"); } catch (e) {}
    }

    themeBtn.addEventListener("click", function () {
      setTheme(!document.body.classList.contains("dark"));
    });

    // При открытии страницы вспоминаем прошлый выбор
    try { setTheme(localStorage.getItem("calc-theme") === "dark"); } catch (e) {}

    // ===== Подключаем кнопки =====
    document.querySelectorAll("[data-digit]").forEach(function (btn) {
      btn.addEventListener("click", function () { pressDigit(btn.dataset.digit); });
    });

    document.querySelectorAll("[data-op]").forEach(function (btn) {
      btn.addEventListener("click", function () { pressOperator(btn.dataset.op); });
    });

    document.getElementById("equals").addEventListener("click", finish);
    document.getElementById("clear").addEventListener("click", clearAll);
    document.getElementById("back").addEventListener("click", pressBack);

    // ===== Бонус: управление с клавиатуры =====
    document.addEventListener("keydown", function (e) {
      if (e.key >= "0" && e.key <= "9") pressDigit(e.key);
      else if ("+-*/".includes(e.key)) pressOperator(e.key);
      else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); finish(); }
      else if (e.key === "Backspace") pressBack();
      else if (e.key === "Escape" || e.key.toLowerCase() === "c") clearAll();
    });
  </script>

</body>
</html>
